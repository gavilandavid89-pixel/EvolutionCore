databases:
  - name: pril-database
    plan: free
    region: ohio
    databaseName: pril_database
    user: pril_database_user
services:
  - type: web
    name: pril-backend-api
    runtime: node
    plan: free
    region: ohio
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pril-database
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://pril-tu-web-de-videos.onrender.com
